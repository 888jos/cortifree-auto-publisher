name: Deploy CortiFree to canonical Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortifree-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub secret VERCEL_TOKEN. Re-authorize Vercel or add a team-scoped Vercel token."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link canonical Vercel project
        run: vercel link --yes --project cortifree-auto-publisher --scope 888jos-projects --token "$VERCEL_TOKEN"

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy CortiFree production
        run: vercel deploy --prod --force --yes --token "$VERCEL_TOKEN"
