name: Record CortiFree acceptance gate

on:
  workflow_dispatch:
    inputs:
      reviewed:
        description: "Number of carousels manually reviewed"
        required: true
        default: "20"
      usable:
        description: "Number usable without manual visual correction"
        required: true
        default: "15"
      batch_id:
        description: "Acceptance batch ID (optional)"
        required: false
        default: ""
      notes:
        description: "Short review note (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || vars.NEXT_PUBLIC_CONVEX_URL }}
      CORTIFREE_BACKEND_SECRET: ${{ secrets.CORTIFREE_BACKEND_SECRET }}
      ACCEPTANCE_REVIEWED: ${{ inputs.reviewed }}
      ACCEPTANCE_USABLE: ${{ inputs.usable }}
      ACCEPTANCE_BATCH_ID: ${{ inputs.batch_id }}
      ACCEPTANCE_NOTES: ${{ inputs.notes }}
      ALLOW_RUNTIME_JSON_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require Convex runtime credentials
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_CONVEX_URL CORTIFREE_BACKEND_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - run: npm run acceptance:record
