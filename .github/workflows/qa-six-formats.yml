name: Generate six format QA samples
on:
  push:
    branches: ["test/generate-six-formats-20261001"]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_BACKEND: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL_PRIMARY: ${{ vars.OPENAI_MODEL_PRIMARY || 'gpt-5.6-luna' }}
      OPENAI_MODEL_QA: ${{ vars.OPENAI_MODEL_QA || 'gpt-5.6-terra' }}
      IMAGE_GENERATION_ENABLED: "false"
      ALLOW_RUNTIME_JSON_FALLBACK: "false"
      DRY_RUN: "true"
      AUTONOMY_AUTO_APPROVE: "false"
      AUTONOMY_AUTO_PUBLISH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate one real draft per active format
        run: npx tsx scripts/qa-six-formats.ts
